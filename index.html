<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Para Ti ❤️ — Una Galaxia de Amor</title>
<meta name="description" content="Una galaxia romántica con corazón brillante, anillo de amor y frases flotando solo para ti.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #050208; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Indie Flower', 'Segoe Script', cursive;
  }
  canvas { display: block; }

  #main-title {
    position: fixed; top: 34px; left: 0; right: 0; width: 100%;
    font-size: 2.4em; color: #ffd6e8; text-align: center;
    text-shadow: 0 0 10px #ff4d88, 0 0 26px #ff1f6d, 0 0 46px #b3125f;
    z-index: 10; pointer-events: none; padding: 0 12px; line-height: 1.15;
  }
  @media (max-width: 768px) { #main-title { font-size: 1.5em; top: 20px; } }

  #start-screen {
    position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, #1a0612 0%, #050208 70%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: #fff; z-index: 9999; padding: 20px; cursor: pointer;
    transition: opacity .7s ease, visibility .7s ease;
  }
  #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #start-heart {
    font-size: clamp(74px, 23vmin, 148px); line-height: 1;
    filter: drop-shadow(0 0 14px rgba(255,77,136,.9)) drop-shadow(0 0 40px rgba(255,31,109,.5));
    animation: latido 1.3s ease-in-out infinite; transform-origin: 50% 55%;
  }
  @keyframes latido {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.16); }
    24% { transform: scale(1); }
    36% { transform: scale(1.08); }
    50% { transform: scale(1); }
  }
  #start-text {
    font-size: 1.8em; color: #ffd6e8; text-align: center;
    text-shadow: 0 0 8px #ff4d88; margin-top: clamp(16px, 3.5vh, 28px);
    animation: parpadeo 2.2s ease-in-out infinite;
  }
  @keyframes parpadeo { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #start-heart, #start-text { animation: none; } }

  #toolbar {
    position: fixed; bottom: 16px; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 12px;
  }
  #toolbar button {
    font-family: inherit; font-size: 1.05em; cursor: pointer;
    color: #ffd6e8; background: rgba(255,31,109,.16);
    border: 1px solid rgba(255,77,136,.6); border-radius: 999px;
    padding: 8px 18px; backdrop-filter: blur(4px);
    text-shadow: 0 0 6px #ff4d88;
  }
  #toolbar button:hover { background: rgba(255,31,109,.32); }
  #toolbar input[type="file"] { display: none; }
  #hint {
    position: fixed; bottom: 64px; left: 0; right: 0; z-index: 10; text-align: center;
    color: rgba(255,214,232,.55); font-size: .95em; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1 id="main-title"></h1>
<div id="hint">Arrastra para girar · Rueda o pellizca para acercar 💫</div>

<div id="start-screen">
  <div id="start-heart">❤️</div>
  <div id="start-text">Toca para iniciar</div>
</div>

<div id="toolbar">
  <button id="btn-music" title="Elegir música">🎵 Música</button>
  <button id="btn-photos" title="Agregar tus fotos">📷 Fotos</button>
  <input type="file" id="file-music" accept="audio/*">
  <input type="file" id="file-photos" accept="image/*" multiple>
</div>

<audio id="audio" loop>
  <source src="assets/musica.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
<script>
// ==================== CONFIGURA AQUÍ TU DEDICATORIA ====================
const CONFIG = {
  titulo: "Para Ti, Mi Amor ❤️",
  frases: [
    "❤️ Eres mi persona favorita", "💖 Contigo todo es mejor", "❤️ Gracias por existir",
    "💕 Eres mi mejor casualidad", "❤️ Mi lugar favorito eres tú", "💖 Te quiero más cada día",
    "❤️ Eres mi sol en días grises", "💕 Contigo el tiempo vuela", "❤️ Mi corazón te eligió a ti",
    "💖 Eres mi sueño cumplido", "❤️ A tu lado todo brilla", "💕 Eres magia en mi vida",
    "❤️ Te pienso a cada momento", "💖 Mi amor por ti no tiene fin", "❤️ Eres mi paz y mi locura",
    "💕 Contigo quiero envejecer", "❤️ Eres mi principio y mi fin", "💖 Nada se compara contigo",
    "❤️ Eres la razón de mi sonrisa", "💕 Mi universo entero eres tú"
  ]
};
// ======================================================================

document.getElementById('main-title').textContent = CONFIG.titulo;
const audio = document.getElementById('audio');

// ---------- Escena 3D ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0312, 0.0009);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 5000);
let targetDist = 300, currentDist = 300, rotX = 0.22, rotY = 0;

// Estrellas (blancas + rosadas)
(function makeStars() {
  const count = 2200, spread = 3000;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const palette = [[1,1,1],[1,.75,.87],[1,.55,.7],[.85,.6,1],[1,.9,.95]];
  for (let i = 0; i < count; i++) {
    const r = spread * (0.3 + Math.random() * 0.7);
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph);
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    const c = palette[(Math.random() * palette.length) | 0];
    col[i*3] = c[0]; col[i*3+1] = c[1]; col[i*3+2] = c[2];
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 2, vertexColors: true, depthWrite: false })));
})();

// Nebulosa rosada de fondo (procedural, sin imágenes externas)
(function makeNebula() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const blobs = [[256,200,'255,31,109'],[150,300,'179,18,95'],[360,320,'255,120,170'],[256,120,'120,40,160']];
  blobs.forEach(([x,y,rgb]) => {
    const grad = g.createRadialGradient(x,y,10,x,y,220);
    grad.addColorStop(0, 'rgba(' + rgb + ',.30)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(0,0,512,512);
  });
  const tex = new THREE.CanvasTexture(c);
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(2400, 32, 32),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, depthWrite: false })
  );
  scene.add(sky);
})();

// Corazón central wireframe AMARILLO (reemplaza al planeta)
function makeHeartShape() {
  const s = new THREE.Shape();
  s.moveTo(5, 5);
  s.bezierCurveTo(5, 5, 4, 0, 0, 0);
  s.bezierCurveTo(-6, 0, -6, 7, -6, 7);
  s.bezierCurveTo(-6, 11, -3, 15.4, 5, 19);
  s.bezierCurveTo(12, 15.4, 16, 11, 16, 7);
  s.bezierCurveTo(16, 7, 16, 0, 10, 0);
  s.bezierCurveTo(7, 0, 5, 5, 5, 5);
  return s;
}
const HEART_BASE = 3.4;
const heartGeo = new THREE.ExtrudeGeometry(makeHeartShape(), {
  depth: 6, bevelEnabled: true, bevelThickness: 1.5, bevelSize: 1.5, bevelSegments: 3, curveSegments: 24
});
heartGeo.center();
const heart = new THREE.LineSegments(
  new THREE.WireframeGeometry(heartGeo),
  new THREE.LineBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.95 })
);
heart.scale.set(HEART_BASE, HEART_BASE, HEART_BASE);
scene.add(heart);
scene.add(new THREE.PointLight(0xffd700, 1.2, 900));

// Resplandor dorado pulsante (a juego con el corazón amarillo)
function makeGlow(size, c1, c2) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size/2,size/2,size*0.05,size/2,size/2,size*0.5);
  grad.addColorStop(0, 'rgba(' + c1 + ',0.6)');
  grad.addColorStop(0.5, 'rgba(' + c2 + ',0.28)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const GLOW_BASE = 380;
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlow(768, '255,215,130', '255,170,0'), transparent: true, depthWrite: false
}));
glow.scale.set(GLOW_BASE, GLOW_BASE, 1);
scene.add(glow);

// Anillo del amor (dorado-rosado, estilo Saturno)
function ringTexture(size) {
  size = size || 1024;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.translate(size/2, size/2);
  const rIn = size * 0.205, rOut = size * 0.49;
  const grd = g.createRadialGradient(0,0,rIn,0,0,rOut);
  grd.addColorStop(0.00, 'rgba(255,240,248,1)');
  grd.addColorStop(0.30, 'rgba(255,170,205,1)');
  grd.addColorStop(0.65, 'rgba(255,77,136,0.95)');
  grd.addColorStop(1.00, 'rgba(200,20,90,0.85)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(0,0,rOut,0,Math.PI*2); g.arc(0,0,rIn,0,Math.PI*2,true); g.closePath(); g.fill();
  for (let i = 0; i < 26; i++) {
    const r = rIn + (rOut - rIn) * (i / 25);
    g.beginPath(); g.arc(0,0,r,0,Math.PI*2);
    g.lineWidth = (rOut - rIn) / 26 * (0.55 + Math.random() * 0.35);
    g.strokeStyle = (i % 3 === 0) ? 'rgba(120,10,50,0.22)' : 'rgba(255,235,245,0.18)';
    g.stroke();
  }
  return new THREE.CanvasTexture(c);
}
const ring = new THREE.Mesh(
  new THREE.RingGeometry(42, 116, 160),
  new THREE.MeshBasicMaterial({ map: ringTexture(), transparent: true, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
);
ring.rotation.x = Math.PI / 2;
scene.add(ring);

// Frases flotantes
function makeTextTexture(text, color) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.shadowColor = color; ctx.shadowBlur = 30;
  let fs = 58;
  ctx.font = fs + "px 'Indie Flower', cursive";
  while (ctx.measureText(text).width > 464 && fs > 24) { fs -= 2; ctx.font = fs + "px 'Indie Flower', cursive"; }
  ctx.fillText(text, 256, 64);
  return new THREE.CanvasTexture(c);
}
const COLORS = ['#ff4d88','#ff77aa','#ff99c0','#ffb3d1','#ff1f6d','#ff5c9d','#ffc2da','#e75480'];
const textGroup = new THREE.Group(); scene.add(textGroup);
function populatePhrases() {
  document.fonts.load("40px 'Indie Flower'").catch(() => {}).then(() => {
    for (let i = 0; i < 150; i++) {
      const tex = makeTextTexture(CONFIG.frases[i % CONFIG.frases.length], COLORS[i % COLORS.length]);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      sp.scale.set(68, 17, 1);
      const phi = Math.acos(2 * Math.random() - 1), theta = Math.random() * Math.PI * 2;
      const r = 150 + Math.random() * 120;
      sp.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
      sp.userData = { phi, theta, radius: r, speed: 0.001 + Math.random() * 0.001 };
      textGroup.add(sp);
    }
  });
}
populatePhrases();

// Corazones flotantes (procedurales; se reemplazan por tus fotos si agregas)
function drawHeartShape(ctx, s) {
  ctx.beginPath();
  ctx.moveTo(s/2, s*0.88);
  ctx.bezierCurveTo(s*0.05, s*0.55, s*0.08, s*0.12, s*0.5, s*0.32);
  ctx.bezierCurveTo(s*0.92, s*0.12, s*0.95, s*0.55, s/2, s*0.88);
  ctx.closePath();
}
const photoGroup = new THREE.Group(); scene.add(photoGroup);
function heartTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(128,110,10,128,128,150);
  grad.addColorStop(0, '#ffd6e8'); grad.addColorStop(0.5, '#ff4d88'); grad.addColorStop(1, '#b3125f');
  ctx.fillStyle = grad; ctx.shadowColor = '#ff1f6d'; ctx.shadowBlur = 30;
  drawHeartShape(ctx, 256); ctx.fill();
  return new THREE.CanvasTexture(c);
}
const defaultHeartTex = heartTexture();
function orbitSprite(material, size) {
  const sp = new THREE.Sprite(material);
  sp.scale.set(size, size, 1);
  const phi = Math.acos(2 * Math.random() - 1), theta = Math.random() * Math.PI * 2;
  const r = 140 + Math.random() * 170;
  sp.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
  sp.userData = { phi, theta, radius: r, speed: 0.0006 + Math.random() * 0.0012 };
  photoGroup.add(sp);
  return sp;
}
for (let i = 0; i < 26; i++) {
  orbitSprite(new THREE.SpriteMaterial({ map: defaultHeartTex, transparent: true }), 22 + Math.random() * 16);
}

// Agregar tus fotos (flotan con marco de corazón)
function addPhotoFile(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.save(); drawHeartShape(ctx, 256); ctx.clip();
    const s = Math.max(256 / img.width, 256 / img.height);
    ctx.drawImage(img, (256 - img.width*s)/2, (256 - img.height*s)/2, img.width*s, img.height*s);
    ctx.restore();
    ctx.strokeStyle = '#ff77aa'; ctx.lineWidth = 10; ctx.shadowColor = '#ff1f6d'; ctx.shadowBlur = 24;
    drawHeartShape(ctx, 256); ctx.stroke();
    const tex = new THREE.CanvasTexture(c);
    orbitSprite(new THREE.SpriteMaterial({ map: tex, transparent: true }), 34 + Math.random() * 14);
  };
  img.src = url;
}

// ---------- Controles ----------
let dragging = false, lx = 0, ly = 0;
function dn(e){ dragging = true; const t = e.touches ? e.touches[0] : e; lx = t.clientX; ly = t.clientY; }
function mv(e){
  if (!dragging) return;
  const t = e.touches ? e.touches[0] : e;
  rotY -= ((t.clientX - lx) / innerWidth) * 5;
  rotX = Math.max(-1.2, Math.min(1.2, rotX + ((t.clientY - ly) / innerHeight) * 3.5));
  lx = t.clientX; ly = t.clientY;
}
function up(){ dragging = false; }
addEventListener('mousedown', dn); addEventListener('mousemove', mv); addEventListener('mouseup', up);
addEventListener('touchstart', dn, { passive: true });
addEventListener('touchmove', mv, { passive: true });
addEventListener('touchend', up, { passive: true });
addEventListener('wheel', (e) => {
  targetDist = Math.max(160, Math.min(600, targetDist + e.deltaY * 0.25));
}, { passive: true });
let pinch = 0;
addEventListener('touchmove', (e) => {
  if (e.touches && e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinch) targetDist = Math.max(160, Math.min(600, targetDist + (pinch - d) * 0.5));
    pinch = d;
  }
}, { passive: true });
addEventListener('touchend', () => { pinch = 0; }, { passive: true });

// ---------- Animación ----------
let t = 0;
(function tick() {
  requestAnimationFrame(tick); t += 0.01;
  ring.rotation.z += 0.003;
  const gs = 1 + Math.sin(t * 0.4) * 0.03;
  glow.scale.set(GLOW_BASE * gs, GLOW_BASE * gs, 1);
  const s = HEART_BASE * (1 + 0.06 * Math.sin(t * 3)); // latido del corazón
  heart.scale.set(s, s, s);
  heart.rotation.y += 0.006; // giro suave para ver el wireframe 3D
  textGroup.children.forEach((sp) => {
    sp.material.opacity = 0.8 + 0.2 * Math.sin(t * 2);
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
  });
  photoGroup.children.forEach((sp) => {
    sp.material.opacity = 0.85 + 0.15 * Math.sin(t * 2 + sp.userData.radius);
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
  });
  currentDist += (targetDist - currentDist) * 0.06;
  const cx = Math.cos(rotX), sx = Math.sin(rotX), cy = Math.cos(rotY), sy = Math.sin(rotY);
  camera.position.set(currentDist*sy*cx, currentDist*sx, currentDist*cy*cx);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
})();

// ---------- Arranque + botones ----------
const startScreen = document.getElementById('start-screen');
startScreen.addEventListener('click', () => {
  startScreen.classList.add('hidden');
  setTimeout(() => { startScreen.style.display = 'none'; }, 800);
  audio.play().catch(() => {}); // si no hay assets/musica.mp3, simplemente no suena
});
const fileMusic = document.getElementById('file-music');
const filePhotos = document.getElementById('file-photos');
document.getElementById('btn-music').addEventListener('click', () => fileMusic.click());
document.getElementById('btn-photos').addEventListener('click', () => filePhotos.click());
fileMusic.addEventListener('change', () => {
  if (fileMusic.files[0]) { audio.src = URL.createObjectURL(fileMusic.files[0]); audio.play().catch(() => {}); }
});
filePhotos.addEventListener('change', () => {
  [...filePhotos.files].slice(0, 10).forEach(addPhotoFile);
  filePhotos.value = '';
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

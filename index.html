<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Feliz Día de las Flores Amarillas 🌻</title>
<meta name="description" content="Una galaxia dorada con corazón de partículas, anillo brillante, girasoles y frases flotando por el Día de las Flores Amarillas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Indie Flower', 'Segoe Script', cursive;
  }
  canvas { display: block; }

  #main-title {
    position: fixed; top: 30px; left: 0; right: 0; width: 100%;
    font-size: 2.4em; color: #FFFACD; text-align: center;
    text-shadow: 0 0 10px #FFD700, 0 0 22px #FFA500, 0 0 44px #b8860b;
    z-index: 10; pointer-events: none; padding: 0 12px; line-height: 1.15;
  }
  @media (max-width: 768px) { #main-title { font-size: 1.5em; top: 20px; } }

  #start-screen {
    position: fixed; inset: 0; background: #000;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: #fff; z-index: 9999; padding: 20px; cursor: pointer;
    transition: opacity .7s ease, visibility .7s ease;
  }
  #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #start-heart {
    font-size: clamp(74px, 23vmin, 148px); line-height: 1;
    filter: drop-shadow(0 0 14px rgba(255,215,0,.85)) drop-shadow(0 0 40px rgba(255,165,0,.45));
    animation: latido 1.3s ease-in-out infinite; transform-origin: 50% 55%;
  }
  @keyframes latido {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.16); }
    24% { transform: scale(1); }
    36% { transform: scale(1.08); }
    50% { transform: scale(1); }
  }
  #start-text {
    font-size: 1.8em; color: #FFFACD; text-align: center;
    text-shadow: 0 0 8px #FFD700; margin-top: clamp(16px, 3.5vh, 28px);
    animation: parpadeo 2.2s ease-in-out infinite;
  }
  @keyframes parpadeo { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #start-heart, #start-text { animation: none; } }

  /* Botón de música: círculo dorado abajo a la derecha */
  #btn-music {
    position: fixed; right: 18px; bottom: 18px; z-index: 30;
    width: 60px; height: 60px; border-radius: 50%;
    font-size: 26px; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ffe97a, #ffb400 60%, #c77f00);
    border: 2px solid #fff3b0;
    box-shadow: 0 0 18px rgba(255,200,0,.8);
    animation: musicpulse 2.4s ease-in-out infinite;
  }
  @keyframes musicpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  /* Botón de fotos: píldora abajo a la izquierda */
  #toolbar {
    position: fixed; left: 18px; bottom: 18px; z-index: 30;
  }
  #toolbar button {
    font-family: inherit; font-size: 1.05em; cursor: pointer;
    color: #FFFACD; background: rgba(255,180,0,.14);
    border: 1px solid rgba(255,215,0,.6); border-radius: 999px;
    padding: 8px 18px; backdrop-filter: blur(4px);
    text-shadow: 0 0 6px #FFD700;
  }
  #toolbar button:hover { background: rgba(255,180,0,.30); }
  #toolbar input[type="file"], #file-music { display: none; }
  #hint {
    position: fixed; bottom: 84px; left: 0; right: 0; z-index: 10; text-align: center;
    color: rgba(255,250,205,.55); font-size: .95em; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1 id="main-title"></h1>
<div id="hint">Arrastra para girar · Rueda o pellizca para acercar 💫</div>

<div id="start-screen">
  <div id="start-heart">🌻</div>
  <div id="start-text">Toca para iniciar</div>
</div>

<button id="btn-music" title="Elegir música">💌</button>
<div id="toolbar">
  <button id="btn-photos" title="Agregar tus fotos">📷 Fotos</button>
  <input type="file" id="file-photos" accept="image/*" multiple>
</div>
<input type="file" id="file-music" accept="audio/*">

<audio id="audio" loop>
  <source src="assets/musica.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
<script>
// ==================== CONFIGURA AQUÍ TU DEDICATORIA ====================
const CONFIG = {
  titulo: "Feliz Día de las Flores Amarillas 🌻",
  frases: [
    "🌻 Como el girasol, siempre te busco", "🌼 Eres mi sol en cada mañana", "💛 Contigo florece todo",
    "🌻 Tu sonrisa ilumina mi día", "🌼 Amarillo es mi color favorito desde que te conozco", "💛 Eres pura luz",
    "🌻 Gracias por llenar mi vida de color", "🌼 Un girasol para la más bonita", "💛 Floreces en mi corazón",
    "🌻 Eres mi primavera favorita", "🌼 Contigo cada día es soleado", "💛 Brillás más que mil soles",
    "🌻 Mi flor amarilla preferida", "🌼 Que nunca te falten girasoles", "💛 Eres alegría en persona",
    "🌻 Te quiero con todo mi sol", "🌼 Sos la luz de mis días", "💛 Florecer a tu lado es mi plan",
    "🌻 Amarillo como este amor inmenso", "🌼 Para ti, todos mis girasoles"
  ]
};
// ======================================================================

document.getElementById('main-title').textContent = CONFIG.titulo;
const audio = document.getElementById('audio');

// ---------- Escena 3D ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0800, 0.0009);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 5000);
let targetDist = 300, currentDist = 300, rotX = 0.22, rotY = 0;

// Textura de punto suave (para que las partículas brillen redondas)
function dotTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.4, 'rgba(255,255,255,.8)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const dotTex = dotTexture();
const GOLD = [[1,1,1],[1,.95,.75],[1,.85,.35],[1,.75,.15],[1,.9,.5]];
function pickGold() { return GOLD[(Math.random() * GOLD.length) | 0]; }

// Estrellas (blancas + doradas)
(function makeStars() {
  const count = 2200, spread = 3000;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const palette = [[1,1,1],[1,.95,.8],[1,.85,.4],[1,.75,.2],[1,.98,.9]];
  for (let i = 0; i < count; i++) {
    const r = spread * (0.3 + Math.random() * 0.7);
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph);
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    const c = palette[(Math.random() * palette.length) | 0];
    col[i*3] = c[0]; col[i*3+1] = c[1]; col[i*3+2] = c[2];
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 2, vertexColors: true, depthWrite: false })));
})();

// Nebulosa dorada tenue de fondo (procedural, sin imágenes externas)
(function makeNebula() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const blobs = [[256,200,'255,200,60'],[150,300,'150,90,10'],[360,320,'255,160,0'],[256,120,'120,70,0']];
  blobs.forEach(([x,y,rgb]) => {
    const grad = g.createRadialGradient(x,y,10,x,y,220);
    grad.addColorStop(0, 'rgba(' + rgb + ',.22)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(0,0,512,512);
  });
  const tex = new THREE.CanvasTexture(c);
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(2400, 32, 32),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, depthWrite: false })
  );
  scene.add(sky);
})();

// Corazón central de PARTÍCULAS doradas (curva paramétrica de corazón)
const heartGroup = new THREE.Group(); scene.add(heartGroup);
function heartCurve(t) {
  return [
    16 * Math.pow(Math.sin(t), 3),
    13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)
  ];
}
(function makeHeartParticles() {
  const HS = 2.3;
  // Nube dorada con leve dispersión
  const COUNT = 1500;
  const pos = new Float32Array(COUNT * 3), col = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const t = Math.random() * Math.PI * 2;
    const p = heartCurve(t);
    pos[i*3]   = (p[0] + (Math.random()-0.5) * 1.8) * HS;
    pos[i*3+1] = (p[1] + (Math.random()-0.5) * 1.8) * HS;
    pos[i*3+2] = (Math.random()-0.5) * 5;
    const c = pickGold();
    col[i*3] = c[0]; col[i*3+1] = c[1]; col[i*3+2] = c[2];
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  heartGroup.add(new THREE.Points(g, new THREE.PointsMaterial({
    size: 2.4, map: dotTex, vertexColors: true, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending
  })));
  // Contorno blanco-dorado preciso sobre la curva
  const C2 = 500;
  const pos2 = new Float32Array(C2 * 3), col2 = new Float32Array(C2 * 3);
  for (let i = 0; i < C2; i++) {
    const p = heartCurve((i / C2) * Math.PI * 2);
    pos2[i*3] = p[0] * HS; pos2[i*3+1] = p[1] * HS; pos2[i*3+2] = 0;
    col2[i*3] = 1; col2[i*3+1] = 0.96; col2[i*3+2] = 0.8;
  }
  const g2 = new THREE.BufferGeometry();
  g2.setAttribute('position', new THREE.BufferAttribute(pos2, 3));
  g2.setAttribute('color', new THREE.BufferAttribute(col2, 3));
  heartGroup.add(new THREE.Points(g2, new THREE.PointsMaterial({
    size: 3.2, map: dotTex, vertexColors: true, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending
  })));
})();
scene.add(new THREE.PointLight(0xffd700, 1.2, 900));

// Letra "N" dorada en el centro del corazón
function letterTexture(letter) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = "bold 185px Georgia, 'Times New Roman', serif";
  ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 34;
  ctx.fillStyle = '#FFF6C9';
  ctx.fillText(letter, 128, 136);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#FFA500'; ctx.lineWidth = 3;
  ctx.strokeText(letter, 128, 136);
  return new THREE.CanvasTexture(c);
}
const LETTER_BASE = 44;
const letterN = new THREE.Sprite(new THREE.SpriteMaterial({ map: letterTexture('N'), transparent: true, depthWrite: false }));
letterN.scale.set(LETTER_BASE, LETTER_BASE, 1);
scene.add(letterN);

// Resplandor dorado pulsante detrás del corazón
function makeGlow(size, c1, c2) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size/2,size/2,size*0.05,size/2,size/2,size*0.5);
  grad.addColorStop(0, 'rgba(' + c1 + ',0.6)');
  grad.addColorStop(0.5, 'rgba(' + c2 + ',0.28)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const GLOW_BASE = 380;
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlow(768, '255,225,130', '255,170,0'), transparent: true, depthWrite: false
}));
glow.scale.set(GLOW_BASE, GLOW_BASE, 1);
scene.add(glow);

// Anillo de polvo dorado inclinado (polvo de estrellas orbitando)
const dustRing = (function makeDustRing() {
  const COUNT = 2800, R = 100, SP = 30, TILT = 1.25;
  const pos = new Float32Array(COUNT * 3), col = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const a = Math.random() * Math.PI * 2;
    const rr = R + (((Math.random() + Math.random() + Math.random()) / 3) - 0.5) * 2 * SP;
    const x = Math.cos(a) * rr, z0 = Math.sin(a) * rr;
    const y0 = (Math.random() - 0.5) * 7;
    pos[i*3]   = x;
    pos[i*3+1] = y0 * Math.cos(TILT) - z0 * Math.sin(TILT);
    pos[i*3+2] = y0 * Math.sin(TILT) + z0 * Math.cos(TILT);
    const c = pickGold();
    const dim = 0.55 + Math.random() * 0.45;
    col[i*3] = c[0] * dim; col[i*3+1] = c[1] * dim; col[i*3+2] = c[2] * dim;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({
    size: 2.0, map: dotTex, vertexColors: true, transparent: true, opacity: 0.9,
    depthWrite: false, blending: THREE.AdditiveBlending
  }));
  scene.add(pts);
  return pts;
})();

// Frases flotantes (doradas)
function makeTextTexture(text, color) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.shadowColor = color; ctx.shadowBlur = 30;
  let fs = 58;
  ctx.font = fs + "px 'Indie Flower', cursive";
  while (ctx.measureText(text).width > 464 && fs > 24) { fs -= 2; ctx.font = fs + "px 'Indie Flower', cursive"; }
  ctx.fillText(text, 256, 64);
  return new THREE.CanvasTexture(c);
}
const COLORS = ['#ffd700','#ffe066','#ffcc33','#ffb347','#fff2b0','#ffaa00','#f4c430','#ffdb58'];
const textGroup = new THREE.Group(); scene.add(textGroup);
function populatePhrases() {
  document.fonts.load("40px 'Indie Flower'").catch(() => {}).then(() => {
    for (let i = 0; i < 150; i++) {
      const tex = makeTextTexture(CONFIG.frases[i % CONFIG.frases.length], COLORS[i % COLORS.length]);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      sp.scale.set(68, 17, 1);
      const phi = Math.acos(2 * Math.random() - 1), theta = Math.random() * Math.PI * 2;
      const r = 160 + Math.random() * 130;
      sp.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
      sp.userData = { phi, theta, radius: r, speed: 0.001 + Math.random() * 0.001 };
      textGroup.add(sp);
    }
  });
}
populatePhrases();

// Girasoles flotantes (procedurales; se suman tus fotos si agregas)
function flowerTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.translate(128, 128);
  ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 22;
  for (let i = 0; i < 16; i++) {
    ctx.save(); ctx.rotate((i / 16) * Math.PI * 2);
    const g = ctx.createLinearGradient(0, 0, 0, -112);
    g.addColorStop(0, '#ffdf40'); g.addColorStop(1, '#ff9500');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, -70, 21, 52, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const core = ctx.createRadialGradient(0, 0, 4, 0, 0, 36);
  core.addColorStop(0, '#a06a10'); core.addColorStop(1, '#3d2400');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(30,16,0,.8)';
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 26;
    ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 2.2, 0, Math.PI * 2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}
const photoGroup = new THREE.Group(); scene.add(photoGroup);
const defaultFlowerTex = flowerTexture();
function orbitSprite(material, size) {
  const sp = new THREE.Sprite(material);
  sp.scale.set(size, size, 1);
  const phi = Math.acos(2 * Math.random() - 1), theta = Math.random() * Math.PI * 2;
  const r = 150 + Math.random() * 170;
  sp.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
  sp.userData = { phi, theta, radius: r, speed: 0.0006 + Math.random() * 0.0012 };
  photoGroup.add(sp);
  return sp;
}
for (let i = 0; i < 26; i++) {
  orbitSprite(new THREE.SpriteMaterial({ map: defaultFlowerTex, transparent: true }), 22 + Math.random() * 16);
}

// Agregar tus fotos (flotan con marco dorado)
function addPhotoFile(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.save();
    ctx.beginPath(); ctx.arc(128, 128, 112, 0, Math.PI * 2); ctx.clip();
    const s = Math.max(256 / img.width, 256 / img.height);
    ctx.drawImage(img, (256 - img.width*s)/2, (256 - img.height*s)/2, img.width*s, img.height*s);
    ctx.restore();
    ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 10; ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(128, 128, 112, 0, Math.PI * 2); ctx.stroke();
    const tex = new THREE.CanvasTexture(c);
    orbitSprite(new THREE.SpriteMaterial({ map: tex, transparent: true }), 34 + Math.random() * 14);
  };
  img.src = url;
}

// ---------- Controles ----------
let dragging = false, lx = 0, ly = 0;
function dn(e){ dragging = true; const t = e.touches ? e.touches[0] : e; lx = t.clientX; ly = t.clientY; }
function mv(e){
  if (!dragging) return;
  const t = e.touches ? e.touches[0] : e;
  rotY -= ((t.clientX - lx) / innerWidth) * 5;
  rotX = Math.max(-1.2, Math.min(1.2, rotX + ((t.clientY - ly) / innerHeight) * 3.5));
  lx = t.clientX; ly = t.clientY;
}
function up(){ dragging = false; }
addEventListener('mousedown', dn); addEventListener('mousemove', mv); addEventListener('mouseup', up);
addEventListener('touchstart', dn, { passive: true });
addEventListener('touchmove', mv, { passive: true });
addEventListener('touchend', up, { passive: true });
addEventListener('wheel', (e) => {
  targetDist = Math.max(160, Math.min(600, targetDist + e.deltaY * 0.25));
}, { passive: true });
let pinch = 0;
addEventListener('touchmove', (e) => {
  if (e.touches && e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinch) targetDist = Math.max(160, Math.min(600, targetDist + (pinch - d) * 0.5));
    pinch = d;
  }
}, { passive: true });
addEventListener('touchend', () => { pinch = 0; }, { passive: true });

// ---------- Animación ----------
let t = 0;
(function tick() {
  requestAnimationFrame(tick); t += 0.01;
  dustRing.rotation.y -= 0.0009; // el polvo orbita despacio
  const hb = 1 + 0.06 * Math.sin(t * 3); // latido
  heartGroup.scale.set(hb, hb, hb);
  heartGroup.rotation.y += 0.004; // giro suave del corazón
  letterN.scale.set(LETTER_BASE * hb, LETTER_BASE * hb, 1); // la N late junto al corazón
  const gs = 1 + Math.sin(t * 0.4) * 0.03;
  glow.scale.set(GLOW_BASE * gs, GLOW_BASE * gs, 1);
  textGroup.children.forEach((sp) => {
    sp.material.opacity = 0.8 + 0.2 * Math.sin(t * 2);
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
  });
  photoGroup.children.forEach((sp) => {
    sp.material.opacity = 0.85 + 0.15 * Math.sin(t * 2 + sp.userData.radius);
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
  });
  currentDist += (targetDist - currentDist) * 0.06;
  const cx = Math.cos(rotX), sx = Math.sin(rotX), cy = Math.cos(rotY), sy = Math.sin(rotY);
  camera.position.set(currentDist*sy*cx, currentDist*sx, currentDist*cy*cx);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
})();

// ---------- Arranque + botones ----------
const startScreen = document.getElementById('start-screen');
startScreen.addEventListener('click', () => {
  startScreen.classList.add('hidden');
  setTimeout(() => { startScreen.style.display = 'none'; }, 800);
  audio.play().catch(() => {}); // si no hay assets/musica.mp3, simplemente no suena
});
const fileMusic = document.getElementById('file-music');
const filePhotos = document.getElementById('file-photos');
document.getElementById('btn-music').addEventListener('click', () => fileMusic.click());
document.getElementById('btn-photos').addEventListener('click', () => filePhotos.click());
fileMusic.addEventListener('change', () => {
  if (fileMusic.files[0]) { audio.src = URL.createObjectURL(fileMusic.files[0]); audio.play().catch(() => {}); }
});
filePhotos.addEventListener('change', () => {
  [...filePhotos.files].slice(0, 10).forEach(addPhotoFile);
  filePhotos.value = '';
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>

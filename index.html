<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Feliz Día de las Flores Amarillas 🌻</title>
<meta name="description" content="Una dedicatoria dorada: corazón de luz, espiral de estrellas, girasoles, frases flotando y una carta de amor.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: 'Playfair Display', serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { display: block; }

  /* Pantalla inicial */
  #start-screen {
    position: fixed; inset: 0; z-index: 3000;
    background: radial-gradient(circle at center, #3a2a00 0%, #000000 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: #ffe066; cursor: pointer; transition: opacity 1s ease;
    text-shadow: 0 0 15px #ffaa00; padding: 20px; text-align: center;
  }
  #start-screen.hidden { opacity: 0; pointer-events: none; }
  .pulse-text { font-size: 2rem; font-weight: 700; animation: pulse 1.5s infinite alternate; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.1); opacity: 1; } }
  .start-flower { margin-top: 18px; font-size: 3.4rem; animation: flowerBeat 1.1s ease-in-out infinite; }
  @keyframes flowerBeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  .start-name { margin-top: 10px; font-size: 1.1rem; color: #ffdf80; letter-spacing: 3px; }

  /* Título superior */
  #top-title {
    position: fixed; top: 20px; left: 0; width: 100%; text-align: center;
    z-index: 1500; pointer-events: none; font-weight: 800; font-size: 2.6rem; letter-spacing: 1px;
    background: linear-gradient(90deg, #ffe066, #ffaa00, #ffdd55);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 14px rgba(255, 170, 0, 0.6));
    animation: titlePulse 1.6s ease-in-out infinite; padding: 0 12px;
  }
  @keyframes titlePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @media (max-width: 480px) { #top-title { font-size: 1.7rem; top: 14px; } .start-flower { font-size: 2.6rem; } }

  /* Botón de carta */
  #love-letter-btn {
    position: fixed; bottom: 24px; right: 24px; z-index: 1800;
    width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, #ffaa00, #ffe066);
    box-shadow: 0 0 18px rgba(255, 180, 0, 0.65), 0 4px 14px rgba(0,0,0,0.35);
    font-size: 1.55rem; animation: btnBeat 1.8s ease-in-out infinite; transition: transform .25s ease;
  }
  #love-letter-btn:hover { transform: scale(1.08); }
  @keyframes btnBeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  #love-letter-overlay {
    position: fixed; inset: 0; z-index: 2500;
    background: rgba(12, 8, 0, 0.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .4s ease; padding: 24px;
  }
  #love-letter-overlay.visible { opacity: 1; pointer-events: auto; }
  #love-letter-card {
    max-width: 620px; width: 100%; max-height: 82vh; overflow-y: auto; position: relative;
    background: linear-gradient(160deg, rgba(58,42,0,0.96), rgba(15,10,0,0.98));
    border: 1px solid rgba(255,200,60,0.35); border-radius: 22px; padding: 40px 32px;
    box-shadow: 0 0 40px rgba(255,170,0,0.35); color: #fff3d0;
    transform: translateY(18px) scale(.96); transition: transform .4s ease;
  }
  #love-letter-overlay.visible #love-letter-card { transform: translateY(0) scale(1); }
  #love-letter-card h2 {
    text-align: center; margin: 0 0 22px; font-size: 1.6rem; font-weight: 700;
    background: linear-gradient(90deg, #ffe066, #ffaa00, #ffdd55);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  #love-letter-card p { line-height: 1.75; font-size: 1.02rem; margin: 0 0 16px; }
  #love-letter-card p.signoff { text-align: center; font-style: italic; opacity: .92; margin: 4px 0 20px; }
  #love-letter-card .fecha { display: inline-block; width: 100%; text-align: center; font-size: .85rem; color: #ffdf80; margin-bottom: 6px; }
  #love-letter-close {
    position: absolute; top: 14px; right: 16px; background: none; border: none;
    color: #ffdf80; font-size: 1.35rem; cursor: pointer; line-height: 1; padding: 4px;
  }
  #love-letter-close:hover { color: #fff; }
  @media (max-width: 480px) {
    #love-letter-btn { width: 52px; height: 52px; font-size: 1.3rem; bottom: 18px; right: 18px; }
    #love-letter-card { padding: 30px 22px; }
  }

  /* Botones música / fotos abajo a la izquierda */
  #toolbar { position: fixed; left: 18px; bottom: 18px; z-index: 1800; display: flex; gap: 10px; }
  #toolbar button {
    font-family: inherit; font-size: 1em; cursor: pointer; color: #FFFACD;
    background: rgba(255,180,0,.14); border: 1px solid rgba(255,215,0,.6); border-radius: 999px;
    padding: 8px 16px; backdrop-filter: blur(4px); text-shadow: 0 0 6px #FFD700;
  }
  #toolbar button:hover { background: rgba(255,180,0,.30); }
  #toolbar input[type="file"], #file-music { display: none; }
  #hint {
    position: fixed; bottom: 84px; left: 0; right: 0; z-index: 10; text-align: center;
    color: rgba(255,250,205,.55); font-size: .95em; pointer-events: none; font-family: Georgia, serif;
  }
  #bouquet {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 66px; z-index: 15; pointer-events: none;
    opacity: .95;
  }
  #bouquet img {
    width: 112px; height: auto; display: block;
    filter: drop-shadow(0 0 12px rgba(255,180,0,.8));
    animation: bouquetSway 4s ease-in-out infinite; transform-origin: 50% 90%;
  }
  @keyframes bouquetSway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
</style>
</head>
<body>

<div id="start-screen">
  <div class="pulse-text">Toca para iniciar</div>
  <div class="start-flower">🌻</div>
  <div class="start-name">🌻 PARA TI 🌻</div>
</div>

<div id="top-title"></div>

<button id="love-letter-btn" aria-label="Leer mensaje">💌</button>

<div id="love-letter-overlay">
  <div id="love-letter-card">
    <button id="love-letter-close" aria-label="Cerrar mensaje">✕</button>
    <h2 id="letter-title"></h2>
    <div id="letter-body"></div>
  </div>
</div>

<div id="toolbar">
  <button id="btn-music" title="Elegir música">🎵</button>
  <button id="btn-photos" title="Agregar tus fotos">📷</button>
  <input type="file" id="file-photos" accept="image/*" multiple>
</div>
<input type="file" id="file-music" accept="audio/*">
<div id="hint">Arrastra para girar · Rueda o pellizca para acercar 💫</div>
<div id="bouquet"><img id="bouquet-img" alt="Ramo de girasoles"></div>

<canvas id="c"></canvas>
<audio id="audio" loop>
  <source src="assets/musica.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
<script>
// ==================== CONFIGURA AQUÍ TU DEDICATORIA ====================
const CONFIG = {
  titulo: "Feliz Día de las Flores Amarillas 🌻",
  frases: [
    "🌻 Feliz día de las flores amarillas", "🌼 Gracias por tu amistad", "💛 Los amigos son la familia que se elige",
    "🌻 Tu amistad es un regalo", "🌼 Siempre cuentas conmigo", "💛 Que nunca te falten motivos para sonreír",
    "🌻 Brillas con luz propia", "🌼 Gracias por estar en las buenas y en las malas", "💛 Eres una persona increíble",
    "🌻 Los buenos amigos como tú son un tesoro", "🌼 Tu alegría contagia a todos", "💛 Que nuestra amistad dure para siempre",
    "🌻 Celebro tenerte en mi vida", "🌼 Eres sol en días nublados", "💛 Gracias por cada risa compartida",
    "🌻 Un girasol para un gran amigo", "🌼 Contigo todo es más divertido", "💛 Te aprecio más de lo que imaginas",
    "🌻 Que florezcan todos tus sueños", "🌼 AMISTAD QUE FLORECE 💛"
  ],
  carta: {
    titulo: "🌼 Para una Amistad Especial 🌼",
    saludo: "Hola,",
    parrafos: [
      "Hoy quiero regalarte estas flores amarillas, símbolo de la alegría y la amistad verdadera.",
      "Dicen que los amigos son la familia que uno elige, y yo te elijo todos los días: gracias por tus risas, tus consejos y por estar siempre.",
      "Como los girasoles buscan al sol, que nunca te falte luz en tu camino. Aquí estaré para celebrar tus logros y acompañarte en los días grises.",
      "¡Feliz día! Que nuestra amistad siga floreciendo siempre."
    ],
    despedida: "Con cariño,",
    fecha: "💛 Día de las Flores Amarillas 💛",
    firma: "tu amigo 🌻"
  }
};
// ======================================================================

document.getElementById('top-title').textContent = CONFIG.titulo;
document.getElementById('letter-title').textContent = CONFIG.carta.titulo;
const letterBody = document.getElementById('letter-body');
letterBody.innerHTML =
  '<p class="signoff">' + CONFIG.carta.saludo + '</p>' +
  CONFIG.carta.parrafos.map(p => '<p>' + p + '</p>').join('') +
  '<p>' + CONFIG.carta.despedida + '</p>' +
  '<div class="fecha">' + CONFIG.carta.fecha + '</div>' +
  '<p class="signoff">' + CONFIG.carta.firma + '</p>';

const audio = document.getElementById('audio');
const isMobile = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || window.innerWidth <= 820;

// ---------- Escena 3D ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 5000);
let targetDist = 380, currentDist = 380, rotX = 0.2, rotY = 0;

function makeDotTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.55, 'rgba(255,255,255,1)');
  grad.addColorStop(0.85, 'rgba(255,255,255,0.55)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const dotTexture = makeDotTexture();

// Estrellas doradas
(function makeStars(count = isMobile ? 1400 : 2200, spread = 3000) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const palette = [[1,1,1],[1,.95,.8],[1,.85,.4],[1,.75,.2],[1,.98,.9]];
  for (let i = 0; i < count; i++) {
    const r = spread * (0.3 + Math.random() * 0.7);
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph);
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    const c = palette[(Math.random() * palette.length) | 0];
    col[i*3] = c[0]; col[i*3+1] = c[1]; col[i*3+2] = c[2];
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2, vertexColors: true, map: dotTexture, transparent: true, depthWrite: false, opacity: 0.9 })));
})();

// ---------- Corazón dorado (banda + relleno suave) ----------
function heartCurve(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)
  };
}
const HEART_SCALE = 3.2, HEART_THICK = 3.4, HEART_DEPTH = 8.5, HEART_Y = 6;
const heartGroup = new THREE.Group(); scene.add(heartGroup);
(function makeHeart() {
  const COUNT = isMobile ? 4400 : 5800;
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const t = Math.random() * Math.PI * 2;
    const p0 = heartCurve(t), p1 = heartCurve(t + 0.001);
    let nx = -(p1.y - p0.y), ny = (p1.x - p0.x);
    const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
    const off = (Math.random() - 0.5) * HEART_THICK;
    pos[i*3]   = (p0.x + nx * off) * HEART_SCALE;
    pos[i*3+1] = (p0.y + ny * off + HEART_Y) * HEART_SCALE;
    pos[i*3+2] = (Math.random() - 0.5) * HEART_DEPTH;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  heartGroup.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xffc200, size: 1.4, map: dotTexture, transparent: true,
    depthWrite: false, opacity: 0.95, blending: THREE.AdditiveBlending
  })));
  // Relleno suave interior
  const poly = [];
  for (let i = 0; i < 128; i++) { const p = heartCurve((i / 128) * Math.PI * 2); poly.push([p.x, p.y + HEART_Y]); }
  function inside(px, py) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) c = !c;
    }
    return c;
  }
  const FILL = 1000;
  const fp = new Float32Array(FILL * 3);
  let placed = 0, guard = 0;
  while (placed < FILL && guard++ < FILL * 40) {
    const px = -16 + Math.random() * 32, py = -17 + HEART_Y + Math.random() * 30;
    if (!inside(px, py)) continue;
    fp[placed*3] = px * HEART_SCALE;
    fp[placed*3+1] = py * HEART_SCALE;
    fp[placed*3+2] = (Math.random() - 0.5) * 6;
    placed++;
  }
  const fg = new THREE.BufferGeometry();
  fg.setAttribute('position', new THREE.BufferAttribute(fp, 3));
  heartGroup.add(new THREE.Points(fg, new THREE.PointsMaterial({
    color: 0xffd755, size: 1.2, map: dotTexture, transparent: true,
    depthWrite: false, opacity: 0.55, blending: THREE.AdditiveBlending
  })));
})();

// Letra "N" dorada sobre el corazón
function letterTexture(letter) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = "800 185px 'Playfair Display', Georgia, serif";
  ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 34;
  ctx.fillStyle = '#FFF6C9';
  ctx.fillText(letter, 128, 136);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#FFA500'; ctx.lineWidth = 3;
  ctx.strokeText(letter, 128, 136);
  return new THREE.CanvasTexture(c);
}
const LETTER_BASE = 44;
const letterN = new THREE.Sprite(new THREE.SpriteMaterial({ map: letterTexture('J'), transparent: true, depthWrite: false, depthTest: false }));
letterN.renderOrder = 10;
letterN.position.set(0, HEART_Y * HEART_SCALE, 0);
letterN.scale.set(LETTER_BASE, LETTER_BASE, 1);
scene.add(letterN);

// ---------- Espiral dorada debajo ----------
const spiral = (function makeSpiral() {
  const arms = 4, COUNT = isMobile ? 3400 : 5200;
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const r = Math.random() * 250;
    const arm = Math.floor(Math.random() * arms);
    const th = (arm * Math.PI * 2 / arms) + (r * 0.02) + (Math.random() * 0.4 - 0.2);
    pos[i*3]   = Math.cos(th) * r;
    pos[i*3+1] = -35 - (r * 0.4) + (Math.random() * 8 - 4);
    pos[i*3+2] = Math.sin(th) * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xffb400, size: 1.4, map: dotTexture, transparent: true,
    depthWrite: false, opacity: 0.95, blending: THREE.AdditiveBlending
  }));
  scene.add(pts);
  return pts;
})();

// ---------- Polvo fino dorado ----------
const dust = (function makeDust() {
  const COUNT = isMobile ? 7000 : 10000;
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const r = 150 + Math.random() * 230;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph);
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xffd777, size: 1.1, map: dotTexture, transparent: true,
    depthWrite: false, opacity: 0.5, blending: THREE.AdditiveBlending
  }));
  scene.add(pts);
  return pts;
})();

// Glow central dorado
function makeGlow(size, c1, c2) {
  const c = document.createElement('canvas'); c.width = c.height = size || 768;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size/2, size/2, size*0.05, size/2, size/2, size*0.5);
  grad.addColorStop(0, 'rgba(' + (c1 || '255,190,0') + ',0.7)');
  grad.addColorStop(0.5, 'rgba(' + (c2 || '255,150,0') + ',0.2)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlow(768), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
glow.scale.set(450, 450, 1);
scene.add(glow);

// Anillos planos dorados
function ringTexture(size) {
  size = size || 768;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.translate(size/2, size/2);
  const r1 = size * 0.35, r2 = size * 0.48;
  const grd = g.createRadialGradient(0, 0, r1 * 0.6, 0, 0, r2);
  grd.addColorStop(0, 'rgba(255,250,220,1)');
  grd.addColorStop(0.3, 'rgba(255,215,80,1)');
  grd.addColorStop(0.7, 'rgba(230,140,0,0.8)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(0, 0, r2, 0, Math.PI * 2); g.arc(0, 0, r1, 0, Math.PI * 2, true); g.closePath(); g.fill();
  return new THREE.CanvasTexture(c);
}
const ring1 = new THREE.Mesh(new THREE.RingGeometry(80, 115, 128),
  new THREE.MeshBasicMaterial({ map: ringTexture(), transparent: true, side: THREE.DoubleSide, opacity: 0.32, blending: THREE.AdditiveBlending }));
const ring2 = new THREE.Mesh(new THREE.RingGeometry(125, 155, 128),
  new THREE.MeshBasicMaterial({ map: ringTexture(), transparent: true, side: THREE.DoubleSide, opacity: 0.2, blending: THREE.AdditiveBlending }));
ring1.rotation.x = ring2.rotation.x = Math.PI / 2;
scene.add(ring1); scene.add(ring2);

// ---------- Frases flotantes ----------
const WORDS = [];
const REPEAT = isMobile ? 11 : 12;
for (let i = 0; i < REPEAT; i++) WORDS.push(...CONFIG.frases);
function makeTextTexture(text, color) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let fs = 50;
  ctx.font = '700 ' + fs + 'px "Playfair Display", Georgia, serif';
  while (ctx.measureText(text).width > c.width - 50 && fs > 26) {
    fs -= 2;
    ctx.font = '700 ' + fs + 'px "Playfair Display", Georgia, serif';
  }
  ctx.fillStyle = '#fff'; ctx.shadowColor = color; ctx.shadowBlur = 25;
  ctx.fillText(text, c.width / 2, c.height / 2);
  return new THREE.CanvasTexture(c);
}
const COLORS = ['#ffd700','#ffe066','#ffcc33','#ffb347','#fff2b0','#ffaa00','#f4c430','#ffdb58'];
const textGroup = new THREE.Group(); scene.add(textGroup);
for (let i = 0; i < WORDS.length; i++) {
  const tex = makeTextTexture(WORDS[i], COLORS[i % COLORS.length]);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(98, 12.25, 1);
  const phi = Math.acos(2 * Math.random() - 1), theta = Math.random() * Math.PI * 2;
  const r = 150 + Math.random() * 200;
  sp.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
  sp.userData = { phi, theta, radius: r, speed: 0.001 + Math.random() * 0.001, text: WORDS[i], color: COLORS[i % COLORS.length] };
  textGroup.add(sp);
}
try {
  document.fonts.load('700 50px "Playfair Display"').then(() => {
    textGroup.children.forEach(sp => {
      sp.material.map = makeTextTexture(sp.userData.text, sp.userData.color);
      sp.material.needsUpdate = true;
    });
    letterN.material.map = letterTexture('J');
    letterN.material.needsUpdate = true;
  }).catch(() => {});
} catch (e) { /* fuente no disponible, se usa la predeterminada */ }

// ---------- Girasoles flotantes + tus fotos ----------
function flowerTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.translate(128, 128);
  ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 22;
  for (let i = 0; i < 16; i++) {
    ctx.save(); ctx.rotate((i / 16) * Math.PI * 2);
    const g = ctx.createLinearGradient(0, 0, 0, -112);
    g.addColorStop(0, '#ffdf40'); g.addColorStop(1, '#ff9500');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, -70, 21, 52, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const core = ctx.createRadialGradient(0, 0, 4, 0, 0, 36);
  core.addColorStop(0, '#a06a10'); core.addColorStop(1, '#3d2400');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(30,16,0,.8)';
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 26;
    ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 2.2, 0, Math.PI * 2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}
const photoGroup = new THREE.Group(); scene.add(photoGroup);
const defaultFlowerTex = flowerTexture();
const photoGlowTex = makeGlow(512, '255,210,90', '255,170,0');
// Ramo de girasoles en papel kraft (como el de tu imagen)
let bouquetURL = '';
function drawSunflowerAt(ctx, x, y, r) {
  ctx.save(); ctx.translate(x, y);
  ctx.shadowColor = '#FFD700'; ctx.shadowBlur = r * 0.18;
  const petals = 13;
  for (let i = 0; i < petals; i++) {
    ctx.save(); ctx.rotate((i / petals) * Math.PI * 2);
    const g = ctx.createLinearGradient(0, 0, 0, -r);
    g.addColorStop(0, '#ffdf40'); g.addColorStop(1, '#ff9500');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, -r * 0.55, r * 0.17, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const core = ctx.createRadialGradient(0, 0, r * 0.02, 0, 0, r * 0.28);
  core.addColorStop(0, '#8a5a10'); core.addColorStop(1, '#3d2400');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.27, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function bouquetTexture() {
  const S = 512;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d');
  // tallos
  ctx.strokeStyle = '#3f7a2e'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  [[256,150],[160,140],[352,140],[128,240],[384,240]].forEach(([x, y]) => {
    ctx.beginPath(); ctx.moveTo(256, 498); ctx.quadraticCurveTo(256, 370, x, y + 50); ctx.stroke();
  });
  // hojas
  ctx.fillStyle = '#4c8a35';
  [[196,392,-0.7],[316,392,0.7],[172,330,-1.0],[340,330,1.0],[256,440,0.15]].forEach(([x, y, a]) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 50, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
  // papel kraft (cono)
  ctx.fillStyle = '#c9a06a';
  ctx.beginPath(); ctx.moveTo(118, 298); ctx.lineTo(394, 298); ctx.lineTo(302, 498); ctx.lineTo(210, 498); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(120,80,30,.45)'; ctx.lineWidth = 4;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath(); ctx.moveTo(150 + i * 52, 308); ctx.lineTo(226 + i * 15, 488); ctx.stroke();
  }
  // borde superior del papel
  ctx.fillStyle = '#b78e55';
  ctx.beginPath(); ctx.moveTo(118, 298); ctx.lineTo(394, 298); ctx.lineTo(378, 330); ctx.lineTo(134, 330); ctx.closePath(); ctx.fill();
  // moño de cuerda
  ctx.strokeStyle = '#8a6234'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.ellipse(214, 398, 34, 22, -0.4, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(298, 398, 34, 22, 0.4, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(256, 414); ctx.lineTo(240, 462); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(256, 414); ctx.lineTo(272, 462); ctx.stroke();
  ctx.fillStyle = '#8a6234';
  ctx.beginPath(); ctx.arc(256, 400, 13, 0, Math.PI * 2); ctx.fill();
  // florecitas blancas de relleno
  [[150,230],[362,230],[205,118],[307,118],[118,300],[394,300]].forEach(([x, y]) => {
    ctx.fillStyle = '#fffdf5';
    for (let p = 0; p < 5; p++) {
      const a = (p / 5) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * 9, y + Math.sin(a) * 9, 7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#ffcc33';
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fffdf5';
  });
  // girasoles al frente
  drawSunflowerAt(ctx, 256, 175, 92);
  drawSunflowerAt(ctx, 152, 132, 64);
  drawSunflowerAt(ctx, 360, 132, 64);
  drawSunflowerAt(ctx, 122, 238, 56);
  drawSunflowerAt(ctx, 390, 238, 56);
  bouquetURL = c.toDataURL('image/png');
  return new THREE.CanvasTexture(c);
}
function orbitSlot() {
  const phi = Math.acos(2 * Math.random() - 1), theta = Math.random() * Math.PI * 2;
  const r = 150 + Math.random() * 200;
  return { phi, theta, radius: r, speed: 0.0007 + Math.random() * 0.0009 };
}
function placeOnSlot(sp, slot) {
  sp.position.set(
    slot.radius * Math.sin(slot.phi) * Math.cos(slot.theta),
    slot.radius * Math.cos(slot.phi),
    slot.radius * Math.sin(slot.phi) * Math.sin(slot.theta)
  );
  sp.userData = slot;
  photoGroup.add(sp);
}
const bouquetTex = bouquetTexture();
document.getElementById('bouquet-img').src = bouquetURL;
const FLOWER_COUNT = isMobile ? 20 : 30;
for (let i = 0; i < FLOWER_COUNT; i++) {
  const isBouquet = (i % 4 === 0); // 1 de cada 4 flores se cambia por el ramo
  const size = isBouquet ? 44 + Math.random() * 16 : 20 + Math.random() * 22;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: isBouquet ? bouquetTex : defaultFlowerTex, transparent: true }));
  sp.scale.set(size, size, 1);
  placeOnSlot(sp, orbitSlot());
}
// Anillo de ramos alrededor del universo
const bouquetRing = new THREE.Group(); scene.add(bouquetRing);
bouquetRing.rotation.x = 0.15;
(function makeBouquetRing() {
  const N = 14;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const r = 280 + (Math.random() - 0.5) * 40;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: bouquetTex, transparent: true }));
    const s = 48 + Math.random() * 14;
    sp.scale.set(s, s, 1);
    sp.position.set(Math.cos(a) * r, -30 + Math.random() * 90, Math.sin(a) * r);
    bouquetRing.add(sp);
  }
})();
function addPhotoFile(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const slot = orbitSlot();
    const base = 30;
    const glowSp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: photoGlowTex, transparent: true, depthWrite: false, opacity: 0.6, blending: THREE.AdditiveBlending
    }));
    glowSp.scale.set(base * 1.6, base * 1.6, 1);
    placeOnSlot(glowSp, { ...slot });
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.save();
    ctx.beginPath(); ctx.arc(128, 128, 112, 0, Math.PI * 2); ctx.clip();
    const s = Math.max(256 / img.width, 256 / img.height);
    ctx.drawImage(img, (256 - img.width*s)/2, (256 - img.height*s)/2, img.width*s, img.height*s);
    ctx.restore();
    ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 10; ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(128, 128, 112, 0, Math.PI * 2); ctx.stroke();
    const photo = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity: 0.96 }));
    const ratio = img.naturalWidth / img.naturalHeight;
    if (ratio >= 1) photo.scale.set(base * ratio, base, 1);
    else photo.scale.set(base, base / ratio, 1);
    placeOnSlot(photo, { ...slot, isPhoto: true });
  };
  img.src = url;
}

// ---------- Controles ----------
let dragging = false, lx = 0, ly = 0;
function dn(e){ dragging = true; const t = e.touches ? e.touches[0] : e; lx = t.clientX; ly = t.clientY; }
function mv(e){
  if (!dragging) return;
  if (e.touches && e.touches.length > 1) return;
  const t = e.touches ? e.touches[0] : e;
  rotY -= ((t.clientX - lx) / innerWidth) * 5;
  rotX = Math.max(-1.25, Math.min(1.25, rotX + ((t.clientY - ly) / innerHeight) * 3.5));
  lx = t.clientX; ly = t.clientY;
}
function up(){ dragging = false; }
addEventListener('mousedown', dn); addEventListener('mousemove', mv); addEventListener('mouseup', up);
addEventListener('touchstart', dn, { passive: true });
addEventListener('touchmove', mv, { passive: true });
addEventListener('touchend', up, { passive: true });
addEventListener('wheel', (e) => {
  targetDist = Math.max(180, Math.min(1100, targetDist + e.deltaY * 0.25));
}, { passive: true });
let pinch = 0;
addEventListener('touchmove', (e) => {
  if (e.touches && e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinch) targetDist = Math.max(180, Math.min(1100, targetDist + (pinch - d) * 0.85));
    pinch = d;
  }
}, { passive: true });
addEventListener('touchend', () => { pinch = 0; }, { passive: true });

// ---------- Animación ----------
let t = 0;
(function tick() {
  requestAnimationFrame(tick); t += 0.01;
  ring1.rotation.z += 0.002;
  ring2.rotation.z -= 0.0015;
  spiral.rotation.y -= 0.0045;
  bouquetRing.rotation.y += 0.0008; // el anillo de ramos orbita despacio
  dust.rotation.y += 0.0006;
  const gs = 1 + Math.sin(t * 0.4) * 0.03;
  glow.scale.set(450 * gs, 450 * gs, 1);
  const hb = 1 + 0.05 * Math.sin(t * 4); // latido
  heartGroup.scale.set(hb, hb, hb);
  letterN.scale.set(LETTER_BASE * hb, LETTER_BASE * hb, 1);
  textGroup.children.forEach((sp) => {
    sp.material.opacity = 0.8 + 0.2 * Math.sin(t * 2);
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
  });
  photoGroup.children.forEach((sp) => {
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
    if (sp.userData.isPhoto) sp.material.opacity = 0.82 + 0.14 * Math.sin(t * 1.6 + sp.userData.radius);
    else sp.material.opacity = 0.85 + 0.15 * Math.sin(t * 2 + sp.userData.radius);
  });
  currentDist += (targetDist - currentDist) * 0.06;
  const cx = Math.cos(rotX), sx = Math.sin(rotX), cy = Math.cos(rotY), sy = Math.sin(rotY);
  camera.position.set(currentDist*sy*cx, currentDist*sx, currentDist*cy*cx);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
})();

// ---------- Arranque + botones ----------
const startScreen = document.getElementById('start-screen');
let started = false;
startScreen.addEventListener('click', () => {
  if (started) return; started = true;
  startScreen.classList.add('hidden');
  setTimeout(() => { startScreen.style.display = 'none'; }, 1100);
  audio.play().catch(() => {});
});
const letterBtn = document.getElementById('love-letter-btn');
const letterOverlay = document.getElementById('love-letter-overlay');
document.getElementById('love-letter-close').addEventListener('click', () => letterOverlay.classList.remove('visible'));
letterBtn.addEventListener('click', () => letterOverlay.classList.add('visible'));
letterOverlay.addEventListener('click', (e) => { if (e.target === letterOverlay) letterOverlay.classList.remove('visible'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') letterOverlay.classList.remove('visible'); });
const fileMusic = document.getElementById('file-music');
const filePhotos = document.getElementById('file-photos');
document.getElementById('btn-music').addEventListener('click', () => fileMusic.click());
document.getElementById('btn-photos').addEventListener('click', () => filePhotos.click());
fileMusic.addEventListener('change', () => {
  if (fileMusic.files[0]) { audio.src = URL.createObjectURL(fileMusic.files[0]); audio.play().catch(() => {}); }
});
filePhotos.addEventListener('change', () => {
  [...filePhotos.files].slice(0, 10).forEach(addPhotoFile);
  filePhotos.value = '';
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
